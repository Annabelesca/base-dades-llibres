<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base de dades de llibres</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; color: #222; }
  h1 { margin-top: 0; }
  form { background: #fff; padding: 15px; border-radius: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
  label { display: flex; flex-direction: column; font-size: 14px; font-weight: bold; }
  input, select { padding: 6px; font-size: 15px; margin-top: 4px; }
  .botons { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { padding: 8px 14px; font-size: 15px; cursor: pointer; }
  .suggeriments { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
  #cerca { padding: 8px; width: 320px; max-width: 100%; font-size: 15px; margin-bottom: 10px; }
  #estat { color: #666; font-size: 14px; min-height: 18px; margin-bottom: 8px; }
  .taula-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border: 1px solid #ccc; padding: 6px; text-align: left; font-size: 14px; vertical-align: middle; }
  th { background: #ddd; }
  img.portada { width: 50px; height: 70px; object-fit: cover; }
  .buit { text-align: center; color: #777; padding: 20px; }
</style>
</head>
<body>

<h1>Base de dades de llibres</h1>
<div id="estat">Carregant...</div>

<input id="cerca" type="search" placeholder="Cerca per títol, autor, ISBN o temàtica...">

<form id="formulari">
  <label>ISBN <input id="isbn" required></label>
  <label>Títol <input id="titol" required></label>
  <label>Autor/s <input id="autor"></label>
  <label>Tapa
    <select id="tapa"><option>Dura</option><option>Blanda</option></select>
  </label>
  <label>Tipus de lletra
    <select id="lletra">
      <option>Imprenta</option><option>Lligada</option><option>De pal</option>
      <option>De pal + lligada</option><option>Lligada + imprenta</option>
    </select>
  </label>
  <label>Temàtica <input id="tematica" list="tematiques"></label>
  <datalist id="tematiques"></datalist>
  <div id="suggeriments" class="suggeriments"></div>
  <label>Nº pàgines <input id="pagines" type="number" min="0"></label>
  <input type="hidden" id="editId">

  <div class="botons">
    <button type="button" id="busca">Buscar dades per ISBN</button>
    <button type="submit">Guardar llibre</button>
    <button type="button" id="buida">Netejar formulari</button>
    <button type="button" id="completa-tots">Completar tots els buits per ISBN</button>
    <button type="button" id="exporta-csv">Exportar a CSV (Excel)</button>
    <button type="button" id="exporta-json">Fer còpia (JSON)</button>
    <label style="flex-direction: row; align-items: center; font-weight: normal;">
      Importar còpia: <input type="file" id="importa" accept=".json">
    </label>
    <button type="button" id="oblida-codi">Oblidar el codi d'edició</button>
  </div>
</form>

<div class="taula-wrap">
<table>
  <thead>
    <tr>
      <th>Portada</th><th>ISBN</th><th>Títol</th><th>Autor/s</th><th>Tapa</th>
      <th>Tipus de lletra</th><th>Temàtica</th><th>Nº pàgines</th><th></th>
    </tr>
  </thead>
  <tbody id="cos"></tbody>
</table>
</div>

<script>
  // URL de la aplicación web de Apps Script (no es secreta: la escritura exige el código de edición)
  const API = 'https://script.google.com/macros/s/AKfycbxRsw1BdR4IOj5FxYcYMUAMNeVAunT8uM86UcgBqOTeNvb1a-zaJvI7XeeGNxtDjCSfdA/exec';

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const soloIsbn = s => String(s ?? '').replace(/[^0-9Xx]/g, '');
  const nouId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  let llibres = [];
  let codi = localStorage.getItem('codi-llibres') || '';

  // ---------- Comunicación con la hoja ----------

  async function carrega() {
    try {
      const resposta = await fetch(API);
      const dades = await resposta.json();
      llibres = (dades.llibres || []).map(l => ({ ...l, isbn: String(l.isbn ?? ''), pagines: l.pagines ?? '' }));
      $('estat').textContent = '';
      pinta();
    } catch (err) {
      $('estat').textContent = "No s'ha pogut carregar la base de dades. Revisa la connexió.";
    }
  }

  function demanaCodi() {
    if (!codi) {
      codi = prompt("Codi d'edició (el demanarà només una vegada en aquest ordinador):") || '';
      if (codi) localStorage.setItem('codi-llibres', codi);
    }
    return !!codi;
  }

  async function envia(accio, dades) {
    if (!demanaCodi()) throw new Error("Cal el codi d'edició per modificar la base de dades.");
    const resposta = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ token: codi, accio, ...dades })
    });
    const resultat = await resposta.json();
    if (!resultat.ok) {
      if (resultat.error === 'Codi incorrecte') {
        codi = '';
        localStorage.removeItem('codi-llibres');
      }
      throw new Error(resultat.error || 'Error desconegut');
    }
    await carrega();
  }

  // ---------- Pantalla ----------

  function pinta() {
    const q = $('cerca').value.trim().toLowerCase();
    const llista = llibres
      .filter(l => Object.values(l).join(' ').toLowerCase().includes(q))
      .sort((a, b) => String(a.titol).localeCompare(String(b.titol), 'ca'));

    $('cos').innerHTML = llista.length === 0
      ? `<tr><td class="buit" colspan="9">No hi ha llibres per mostrar.</td></tr>`
      : llista.map(l => `
        <tr>
          <td><img class="portada" src="https://covers.openlibrary.org/b/isbn/${soloIsbn(l.isbn)}-M.jpg" alt="" onerror="this.style.visibility='hidden'"></td>
          <td>${esc(l.isbn)}</td>
          <td>${esc(l.titol)}</td>
          <td>${esc(l.autor)}</td>
          <td>${esc(l.tapa)}</td>
          <td>${esc(l.lletra)}</td>
          <td>${esc(l.tematica)}</td>
          <td>${esc(l.pagines)}</td>
          <td>
            <button onclick="edita('${esc(l.id)}')">Editar</button>
            <button onclick="esborra('${esc(l.id)}')">Esborrar</button>
          </td>
        </tr>`).join('');

    const temes = [...new Set(llibres.map(l => l.tematica).filter(Boolean))].sort();
    $('tematiques').innerHTML = temes.map(t => `<option value="${esc(t)}">`).join('');
  }

  function buida() {
    $('formulari').reset();
    $('editId').value = '';
    $('suggeriments').innerHTML = '';
  }

  function mostraSuggeriments(subjects) {
    const cont = $('suggeriments');
    cont.innerHTML = '';
    if (!subjects || subjects.length === 0) return;
    cont.innerHTML = '<span>Suggerències:</span>' +
      subjects.slice(0, 8).map(s => `<button type="button" class="suggeriment">${esc(s.name)}</button>`).join('');
  }

  $('suggeriments').addEventListener('click', e => {
    if (e.target.classList.contains('suggeriment')) $('tematica').value = e.target.textContent;
  });

  // ---------- Búsqueda de datos por ISBN ----------

  async function consultaOpenLibrary(isbn) {
    const resposta = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    return (await resposta.json())[`ISBN:${isbn}`];
  }

  async function buscaDadesIsbn(automatic) {
    const isbn = soloIsbn($('isbn').value);
    if (!isbn) {
      if (!automatic) alert("Escriu primer l'ISBN.");
      return;
    }
    $('pagines').placeholder = 'Buscant...';
    try {
      const info = await consultaOpenLibrary(isbn);
      if (info) {
        if (info.title && !$('titol').value) $('titol').value = info.title;
        if (info.authors && !$('autor').value) $('autor').value = info.authors.map(a => a.name).join(', ');
        if (info.number_of_pages && !$('pagines').value) $('pagines').value = info.number_of_pages;
        mostraSuggeriments(info.subjects);
      }
      $('pagines').placeholder = info?.number_of_pages ? '' : 'No trobat';
      if (!info && !automatic) alert("No s'han trobat dades per a aquest ISBN. Escriu-les a mà.");
    } catch (err) {
      $('pagines').placeholder = '';
      if (!automatic) alert("No s'ha pogut connectar amb Open Library.");
    }
  }

  $('isbn').addEventListener('change', () => buscaDadesIsbn(true));
  $('busca').addEventListener('click', () => buscaDadesIsbn(false));

  async function completaTots() {
    const pendents = llibres.filter(l => soloIsbn(l.isbn) && (!l.pagines || !l.autor || !l.titol));
    if (pendents.length === 0) { alert('Tots els llibres amb ISBN ja tenen les dades completes.'); return; }
    if (!confirm(`Buscar dades per a ${pendents.length} llibres? Pot trigar uns minuts.`)) return;

    let completats = 0;
    for (const l of pendents) {
      try {
        const info = await consultaOpenLibrary(soloIsbn(l.isbn));
        if (info) {
          const canvis = {};
          if (!l.titol && info.title) canvis.titol = info.title;
          if (!l.autor && info.authors) canvis.autor = info.authors.map(a => a.name).join(', ');
          if (!l.pagines && info.number_of_pages) canvis.pagines = info.number_of_pages;
          if (Object.keys(canvis).length) {
            await envia('desa', { ...l, ...canvis });
            completats++;
          }
        }
      } catch (err) { /* es continua amb el següent */ }
      await new Promise(r => setTimeout(r, 300));
    }
    alert(`S'han completat dades de ${completats} llibres.`);
  }

  // ---------- Formulari i accions ----------

  $('formulari').addEventListener('submit', async e => {
    e.preventDefault();
    const isbn = $('isbn').value.trim();
    const id = $('editId').value || nouId();

    const repetit = llibres.find(l => soloIsbn(l.isbn) === soloIsbn(isbn) && l.id !== id);
    if (repetit && !confirm(`Ja existeix un llibre amb aquest ISBN ("${repetit.titol}"). Vols guardar-lo igualment?`)) return;

    try {
      await envia('desa', {
        id,
        isbn,
        titol: $('titol').value.trim(),
        autor: $('autor').value.trim(),
        tapa: $('tapa').value,
        lletra: $('lletra').value,
        tematica: $('tematica').value.trim(),
        pagines: $('pagines').value === '' ? '' : Number($('pagines').value)
      });
      buida();
    } catch (err) {
      alert("No s'ha pogut guardar: " + err.message);
    }
  });

  window.edita = id => {
    const l = llibres.find(x => x.id === id);
    if (!l) return;
    $('editId').value = l.id;
    $('isbn').value = l.isbn;
    $('titol').value = l.titol;
    $('autor').value = l.autor;
    $('tapa').value = l.tapa;
    $('lletra').value = l.lletra;
    $('tematica').value = l.tematica;
    $('pagines').value = l.pagines;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.esborra = async id => {
    if (!confirm("Vols esborrar aquest llibre? S'esborrarà per a tothom.")) return;
    try {
      await envia('esborra', { id });
    } catch (err) {
      alert("No s'ha pogut esborrar: " + err.message);
    }
  };

  function descarrega(nom, contingut, tipus) {
    const url = URL.createObjectURL(new Blob([contingut], { type: tipus }));
    const a = document.createElement('a');
    a.href = url;
    a.download = nom;
    a.click();
    URL.revokeObjectURL(url);
  }

  $('exporta-csv').addEventListener('click', () => {
    const capcalera = ['ISBN', 'Títol', 'Autor/s', 'Tapa', 'Tipus de lletra', 'Temàtica', 'Nº pàgines'];
    const cela = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const files = llibres.map(l => [l.isbn, l.titol, l.autor, l.tapa, l.lletra, l.tematica, l.pagines].map(cela).join(';'));
    descarrega('llibres.csv', '\ufeff' + [capcalera.map(cela).join(';'), ...files].join('\n'), 'text/csv;charset=utf-8');
  });

  $('exporta-json').addEventListener('click', () => {
    descarrega('copia-llibres.json', JSON.stringify(llibres, null, 2), 'application/json');
  });

  $('importa').addEventListener('change', async e => {
    const fitxer = e.target.files[0];
    if (!fitxer) return;
    try {
      const dades = JSON.parse(await fitxer.text());
      if (!Array.isArray(dades)) throw new Error('format');
      const ids = new Set(llibres.map(l => l.id));
      let afegits = 0;
      for (const l of dades) {
        if (l.id && ids.has(l.id)) continue;
        await envia('desa', {
          id: l.id || nouId(),
          isbn: String(l.isbn ?? ''),
          titol: l.titol || '',
          autor: l.autor || '',
          tapa: l.tapa || '',
          lletra: l.lletra || '',
          tematica: l.tematica || '',
          pagines: l.pagines === '' || l.pagines == null ? '' : Number(l.pagines)
        });
        afegits++;
      }
      alert(`S'han afegit ${afegits} llibres.`);
    } catch (err) {
      alert("No s'ha pogut importar: " + err.message);
    }
    e.target.value = '';
  });

  $('oblida-codi').addEventListener('click', () => {
    codi = '';
    localStorage.removeItem('codi-llibres');
    alert("S'ha oblidat el codi en aquest ordinador.");
  });

  $('completa-tots').addEventListener('click', completaTots);
  $('buida').addEventListener('click', buida);
  $('cerca').addEventListener('input', pinta);

  carrega();
  setInterval(carrega, 20000); // actualitza automàticament per a tothom
</script>
</body>
</html>
